buildscript {
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["Aeropush_" + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.1.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

// React Native's Gradle plugin wires up codegen + new-arch flags for library
// modules. Applying it is what generates NativeAeropushSpec at build time.
apply plugin: "com.facebook.react"

def getExtOrIntegerDefault = { name ->
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Aeropush_" + name]).toInteger()
}

android {
  namespace "com.aeropush"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      java.srcDirs += ["src/main/java"]
    }
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // The only dependency is React Native itself. No OkHttp, no zip lib —
  // everything uses the Android/JDK standard library.
  implementation "com.facebook.react:react-android"
}
